services:
  - type: web
    name: fleetflow-api
    runtime: node
    rootDir: server
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_ROUNDS
        value: 12
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads
      - key: MAX_UPLOAD_BYTES
        value: 10485760
    
